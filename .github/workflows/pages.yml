# The public site (site/), built and published to GitHub Pages when it or the docs it's made from change on main.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - packages/cli/skill/**
      - packages/ui/src/styles.css
      - CHANGELOG.md
      - app/resources/icon.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # Only the site's own dependencies: not the app's (Electron and the rest).
      - run: pnpm install --frozen-lockfile --filter @superego/site
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm --filter @superego/site build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
