packages:
  - packages/*
  - app
  - extensions/*
  - evals
  - site
allowBuilds:
  electron: true
  esbuild: true
  '@google/genai': false
  protobufjs: false
# No `registry` here or in a project .npmrc: the lockfile names only registry.npmjs.org, and a machine that needs a
# mirror sets it in its own pnpm config (docs/development.md#a-registry-mirror).
# Resolve only versions a week old or more: a mirror that lags npm by a few days (docs/development.md#a-registry-mirror)
# then carries every version the lockfile names, and a compromised release has time to be caught.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@earendil-works/*'
# The six @earendil-works packages Superego is built on aren't on the approved package feed at 1.6.0 (npmjs.org is
# blocked here): they come from vendor/, the published 1.6.0 tarballs as npm serves them (`npm pack`).
overrides:
  '@earendil-works/chord': file:vendor/earendil-works-chord-1.6.0.tgz
  '@earendil-works/pi-ai': file:vendor/earendil-works-pi-ai-1.6.0.tgz
  '@earendil-works/pi-codemode': file:vendor/earendil-works-pi-codemode-1.6.0.tgz
  '@earendil-works/pi-durable': file:vendor/earendil-works-pi-durable-1.6.0.tgz
  '@earendil-works/pi-schema': file:vendor/earendil-works-pi-schema-1.6.0.tgz
  '@earendil-works/pi-telemetry': file:vendor/earendil-works-pi-telemetry-1.6.0.tgz
  # pi-ai 1.6.0 asks for openai 7.59.0, which the feed doesn't carry yet and which is under minimumReleaseAge until
  # 2026-11-24 22:54 UTC; it took it for the types of a response field it reads defensively. The newest the feed has.
  # Drop this once both allow 7.59.0.
  'openai': 7.57.0
  # The Claude Agent SDK's per-platform packages each hold a `claude` of their own: removed, so Superego never ships
  # Claude Code. A Claude Agent thread runs the user's own install (extensions/claude-agent).
  '@anthropic-ai/claude-agent-sdk-darwin-arm64': '-'
  '@anthropic-ai/claude-agent-sdk-darwin-x64': '-'
  '@anthropic-ai/claude-agent-sdk-linux-arm64': '-'
  '@anthropic-ai/claude-agent-sdk-linux-arm64-musl': '-'
  '@anthropic-ai/claude-agent-sdk-linux-x64': '-'
  '@anthropic-ai/claude-agent-sdk-linux-x64-musl': '-'
  '@anthropic-ai/claude-agent-sdk-win32-arm64': '-'
  '@anthropic-ai/claude-agent-sdk-win32-x64': '-'
patchedDependencies:
  '@base-ui/react@1.9.0': patches/@base-ui__react@1.9.0.patch
  '@earendil-works/pi-durable@1.6.0': patches/@earendil-works__pi-durable@1.6.0.patch
  ghostty-web@0.4.0: patches/ghostty-web@0.4.0.patch
