packages:
  - packages/*
  - app
  - extensions/*
  - evals
  - site
allowBuilds:
  electron: true
  esbuild: true
  '@google/genai': false
  protobufjs: false
# No `registry` here or in a project .npmrc: the lockfile names only registry.npmjs.org, and a machine that needs a
# mirror sets it in its own pnpm config (docs/overview.md#a-registry-mirror).
# Resolve only versions a week old or more: a mirror that lags npm by a few days (docs/overview.md#a-registry-mirror)
# then carries every version the lockfile names, and a compromised release has time to be caught.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@earendil-works/*'
# The six @earendil-works packages Superego is built on aren't on the approved package feed at 1.5.0 (npmjs.org is
# blocked here): they come from vendor/, packed from the published 1.5.0 tarballs.
overrides:
  '@earendil-works/chord': file:vendor/earendil-works-chord-1.5.0.tgz
  '@earendil-works/pi-ai': file:vendor/earendil-works-pi-ai-1.5.0.tgz
  '@earendil-works/pi-codemode': file:vendor/earendil-works-pi-codemode-1.5.0.tgz
  '@earendil-works/pi-durable': file:vendor/earendil-works-pi-durable-1.5.0.tgz
  '@earendil-works/pi-schema': file:vendor/earendil-works-pi-schema-1.5.0.tgz
  '@earendil-works/pi-telemetry': file:vendor/earendil-works-pi-telemetry-1.5.0.tgz
  # Chord 1.5.0 asks for exactly ws 8.21.0 as a peer: one ws for it and the daemon (packages/daemon's own pin).
  'ws': 8.23.0
  # The Claude Agent SDK's per-platform packages each hold a `claude` of their own: removed, so Superego never ships
  # Claude Code. A Claude Agent thread runs the user's own install (extensions/claude-agent).
  '@anthropic-ai/claude-agent-sdk-darwin-arm64': '-'
  '@anthropic-ai/claude-agent-sdk-darwin-x64': '-'
  '@anthropic-ai/claude-agent-sdk-linux-arm64': '-'
  '@anthropic-ai/claude-agent-sdk-linux-arm64-musl': '-'
  '@anthropic-ai/claude-agent-sdk-linux-x64': '-'
  '@anthropic-ai/claude-agent-sdk-linux-x64-musl': '-'
  '@anthropic-ai/claude-agent-sdk-win32-arm64': '-'
  '@anthropic-ai/claude-agent-sdk-win32-x64': '-'
patchedDependencies:
  '@earendil-works/pi-durable@1.5.0': patches/@earendil-works__pi-durable@1.5.0.patch
  ghostty-web@0.4.0: patches/ghostty-web@0.4.0.patch
